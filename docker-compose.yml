version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: todo-backend-dev
    ports:
      - "5225:5225"
      - "7101:7101"
    volumes:
      # Mount only source files, not build artifacts
      - ./Data:/app/Data
      - ./Models:/app/Models
      - ./Protos:/app/Protos
      - ./Properties:/app/Properties
      - ./Services:/app/Services
      - ./google:/app/google
      - ./Program.cs:/app/Program.cs
      - ./appsettings.json:/app/appsettings.json
      - ./appsettings.Development.json:/app/appsettings.Development.json
      - ./ToDoDatabase.db:/app/ToDoDatabase.db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5225
    networks:
      - todo-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: todo-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reload
      - ./frontend:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
      # Prevent .nuxt from being overwritten
      - /app/.nuxt
    environment:
      - API_BASE_URL=http://backend:5225
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - todo-network
    restart: unless-stopped

networks:
  todo-network:
    driver: bridge
