version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://host.docker.internal:5225
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
