version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://localhost:5225
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
