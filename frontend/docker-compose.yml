version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: todo-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reload
      - .:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
      # Prevent .nuxt from being overwritten
      - /app/.nuxt
    environment:
      - API_BASE_URL=http://host.docker.internal:5225
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
